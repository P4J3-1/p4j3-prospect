name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Gera o instalador NSIS + ZIP e publica a release com latest.yml,
      # que é o que o atualizador automático dos apps instalados consulta.
      # O instalador vai para o repositório público de releases (o código fica
      # privado). O token padrão não escreve em outro repositório: usa o
      # RELEASES_TOKEN (fine-grained, Contents: read/write nos dois repositórios).
      - run: npm run build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
